name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch' requirements.txt > requirements-nontorch.txt
          pip install -r requirements-nontorch.txt
      - name: Unit tests
        run: pytest -q
      - name: Quick end-to-end smoke run
        run: python experiments/run_all.py --quick
